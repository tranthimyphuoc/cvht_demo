<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVHT Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23C8102E' width='100' height='100' rx='20'/><text x='50' y='64' text-anchor='middle' fill='white' font-size='42' font-family='sans-serif' font-weight='700'>RE</text></svg>" />
</head>
<body>
  <div class="boot-loader" id="bootLoader" aria-live="polite" aria-busy="true">
    <div class="boot-loader-card">
      <div class="boot-spinner" aria-hidden="true"></div>
      <strong>Đang tải dữ liệu…</strong>
      <span>Đồng bộ từ Google Sheets / khởi tạo hệ thống</span>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">RE</div>
        <div class="brand-text">
          <strong>CVHT Hub</strong>
          <span>Rikkei Education</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-user" id="sidebarUser"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="sub" id="pageSub"></div>
          </div>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <div id="modalRoot"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/students-import.js"></script>
  <script src="js/staff-import.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/csv-import.js"></script>
  <script src="js/store.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
